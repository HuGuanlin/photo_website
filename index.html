<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-layout">
        <header class="top-row">
            <div class="About-section">
                <button id="About-btn" data-i18n="AboutText">About</button>
            </div>
            <div class="lang-section">
                <div class="lang-switcher">
                    <input type="radio" id="lang-en" name="language" value="en" checked>
                    <label for="lang-en">EN</label> 

                    <input type="radio" id="lang-de" name="language" value="de">
                    <label for="lang-de">DE</label>

                    <input type="radio" id="lang-zh" name="language" value="zh">
                    <label for="lang-zh">ZH</label>
                </div>
            </div>
        </header>

        <div id="About-overlay" class="hidden"></div>
        <aside id="About-sidebar" class="hidden">
            <button id="close-sidebar">&times;</button>
            <div class="sidebar-content">
                <div class="profile-img-col">
                    <img src="images/profile.jpg" alt="Profile Picture" id="profile-img">
                </div>
                <div class="personal-info-col">
                    <ul>
                        <li><span class="label" data-i18n="nameLabel">Name:</span> <span class="value" data-i18n="nameValue">Hu</span></li>
                        <li><span class="label" data-i18n="natLabel">Nationality:</span> <span class="value" data-i18n="natValue">Chinese</span></li>
                        <li><span class="label" data-i18n="locLabel">Location:</span> <span class="value" data-i18n="locValue">Nürnberg, Germany</span></li>
                        <li><span class="label" data-i18n="emailLabel">Email:</span> <span class="value">huguanlin2024@gmail.com</span></li>
                        <li><span class="label">Instagram:</span> <span class="value">@huguanlin_photographer</span></li>
                        <li><span class="label" data-i18n="rednoteLabel">Rednote:</span> <span class="value">5058400982d</span></li>
                    </ul>
                </div>
            </div>
        </aside>

        <main class="bottom-row">
            <a href="project.html?category=portrait" class="category-col">
                <h2 data-i18n="catPortrait">Portrait</h2>
                <img src="images/home/portrait.jpg" alt="Portrait Photography">
            </a>

            <a href="project.html?category=landscape" class="category-col">
                <h2 data-i18n="catLandscape">Landscape</h2>
                <img src="images/home/landscape.jpg" alt="Landscape Photography">
            </a>

            <a href="project.html?category=street" class="category-col">
                <h2 data-i18n="catStreet">Street</h2>
                <img src="images/home/street.jpg" alt="Street Photography">
            </a>

            <a href="project.html?category=moment" class="category-col">
                <h2 data-i18n="catMoment">Moment</h2>
                <img src="images/home/moment.jpg" alt="Moment Photography">
            </a>
        </main>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
